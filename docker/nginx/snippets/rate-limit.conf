# Rate limiting helpers for ЕСЭДО.
#
# Zones must be defined in http {} context:
#   limit_req_zone $binary_remote_addr zone=fm_auth:10m rate=5r/s;
#   limit_req_zone $binary_remote_addr zone=fm_api:10m rate=30r/s;
#
# HTTP stack: docker/nginx/conf.d/00-rate-limit-zones.conf (auto-included).
# TLS stack: zones are declared at the top of flowmaster-nginx.conf.tpl.
#
# App-layer auth limits (src/lib/auth/rate-limit.server.ts) are in-memory per process.
# Under multiple app replicas they do NOT share counters — nginx (or Redis) is required
# for strict global limits. See docs/SECURITY.md § Rate limiting.
#
# Example location directives (already applied in flowmaster.conf / TLS tpl):
#
#   location /api/ {
#       limit_req zone=fm_api burst=60 nodelay;
#       limit_req_status 429;
#       ...
#   }
#
#   location ^~ /auth/ {
#       limit_req zone=fm_auth burst=20 nodelay;
#       limit_req_status 429;
#       ...
#   }
