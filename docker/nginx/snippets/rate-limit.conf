# Rate limiting for ЕСЭДО (production recommendation).
# Include from the main server block AFTER defining zones in http {} context.
#
# In the http {} block (e.g. docker/nginx/flowmaster-nginx.conf.tpl or host nginx):
#
#   limit_req_zone $binary_remote_addr zone=fm_auth:10m rate=5r/s;
#   limit_req_zone $binary_remote_addr zone=fm_api:10m rate=30r/s;
#
# Then in server {}:
#   include /etc/nginx/snippets/rate-limit.conf;
#
# App-layer auth limits (src/lib/auth/rate-limit.server.ts) are in-memory per process.
# Under multiple app replicas they do NOT share counters — nginx (or Redis) is required
# for strict global limits. See docs/SECURITY.md § Rate limiting.

# Auth-sensitive paths (login, register, EDS, refresh)
location ~ ^/(auth|api/auth) {
    limit_req zone=fm_auth burst=20 nodelay;
    limit_req_status 429;

    proxy_set_header Host $http_host;
    proxy_pass http://app:3000;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# General API (server functions + REST v1)
location /api/ {
    limit_req zone=fm_api burst=60 nodelay;
    limit_req_status 429;

    proxy_set_header Host $http_host;
    proxy_pass http://app:3000;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
